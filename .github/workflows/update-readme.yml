name: Update profile README

on:
  schedule:
    # Fastest GitHub Actions supports for scheduled workflows.
    # A literal every-minute cron ("* * * * *") will not run every minute here.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: update-readme
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update README activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          LASTFM_USERNAME: ${{ secrets.LASTFM_USERNAME }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: node scripts/update-readme.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/now-playing.svg
          if git diff --cached --quiet; then
            echo "No README / music card changes"
            exit 0
          fi
          git commit -m "chore: update profile activity [skip ci]"
          git push
