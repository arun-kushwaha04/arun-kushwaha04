<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-label="bio and likes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07100d"/>
      <stop offset="100%" stop-color="#101a16"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="880" height="340" rx="12" fill="url(#bg)" stroke="#1f3d32" stroke-width="2"/>
  <rect x="0" y="0" width="880" height="34" rx="12" fill="#15241e"/>
  <rect x="0" y="22" width="880" height="12" fill="#15241e"/>
  <circle cx="22" cy="17" r="5" fill="#ff5f56"/>
  <circle cx="39" cy="17" r="5" fill="#ffbd2e"/>
  <circle cx="56" cy="17" r="5" fill="#27c93f"/>
  <text x="440" y="21" text-anchor="middle" fill="#7aa892" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">~/bio-and-likes</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" filter="url(#softGlow)">
    <text x="28" y="64"><tspan fill="#6b8f7c"># things I actually care about</tspan></text>

    <text x="28" y="100"><tspan fill="#7aa892">engineering</tspan><tspan fill="#3dd68c">  =&gt; </tspan><tspan fill="#e6edf3">backend systems, infra, distributed thinking</tspan></text>
    <text x="28" y="130"><tspan fill="#7aa892">physics</tspan><tspan fill="#3dd68c">      =&gt; </tspan><tspan fill="#e6edf3">first principles, models, motion, waves, reality checks</tspan></text>
    <text x="28" y="160"><tspan fill="#7aa892">systems</tspan><tspan fill="#3dd68c">      =&gt; </tspan><tspan fill="#e6edf3">Linux, C++, networking, databases, performance</tspan></text>
    <text x="28" y="190"><tspan fill="#7aa892">tools</tspan><tspan fill="#3dd68c">        =&gt; </tspan><tspan fill="#e6edf3">terminal, GitHub, Codex, ChatGPT, source code</tspan></text>
    <text x="28" y="220"><tspan fill="#7aa892">music</tspan><tspan fill="#3dd68c">        =&gt; </tspan><tspan fill="#e6edf3">YouTube Music, Last.fm, a live now-playing card</tspan></text>
    <text x="28" y="250"><tspan fill="#7aa892">stories</tspan><tspan fill="#3dd68c">      =&gt; </tspan><tspan fill="#e6edf3">Black Clover, Naruto, Dragon Ball Z, willpower with heart</tspan></text>
    <text x="28" y="286"><tspan fill="#7aa892">instinct</tspan><tspan fill="#3dd68c">     =&gt; </tspan><tspan fill="#e6edf3">model it, measure it, simplify it, keep learning</tspan></text>

    <text x="28" y="320"><tspan fill="#6b8f7c"># physics + systems: same habit - explain the motion, then improve the machine</tspan></text>
  </g>
</svg>
